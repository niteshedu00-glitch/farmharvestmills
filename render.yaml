databases:
  - name: farm-harvest-mills-db
    plan: free

services:
  - type: web
    name: farm-harvest-mills
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: farm-harvest-mills-db
          property: connectionString
      - key: SITE_NAME
        value: "Farm Harvest Mills"
